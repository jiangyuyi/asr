[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-mm"
version = "1.4.0"
description = "视频指定时间段 → 语音转写"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio-ffmpeg>=0.4.9",
    # A frozen build has no CA bundle unless one is carried, and a corporate
    # TLS-inspecting proxy presents a root that only lives in the OS store.
    "certifi>=2024.2.2",
    "truststore>=0.9.0; python_version >= '3.10'",
    # Excel export. Pure Python, so it lands in a Windows/macOS bundle without
    # a per-platform compiled dependency.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["PySide6>=6.5", "pytest>=7"]

[project.scripts]
asr-mm = "asr_mm.launcher:main"
asr-mm-gui = "asr_mm.launcher_gui:main"

[tool.setuptools]
packages = ["asr_mm", "asr_mm.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
