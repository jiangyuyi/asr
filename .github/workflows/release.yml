name: release

# Produces the distributable bundles for Windows and macOS and attaches them to
# a GitHub release.
#
# The repo intentionally ships no weights: models are downloaded on first use,
# so a build only needs the ~10 MB engine runtime plus the static ffmpeg.
#
#   push a v* tag  -> build + publish that tag's release
#   manual dispatch -> build only, no release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the build to (blank = build only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            label: windows-x64
          - os: macos-latest     # arm64
            target: mac
            label: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller

      - name: Unit tests
        run: python -m pytest -q

      - name: Stage payload (engine runtime + ffmpeg)
        run: python packaging/prepare_payload.py --target ${{ matrix.target }}

      - name: Build bundles
        # --workpath keeps the PyInstaller cache out of a directory that looks
        # like output: the exes it leaves behind cannot run on their own.
        run: |
          python -m PyInstaller packaging/asr-mm.spec --noconfirm --clean --workpath .pyinstaller-cache

      # Optional: turns a "right-click → Open" install into a double-click one.
      # Skipped unless the Apple secrets are configured, so the build never
      # breaks for someone without a developer account.
      - name: Sign (macOS)
        if: matrix.target == 'mac'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12}" ]; then
            echo "::notice::No Apple signing secrets configured — shipping unsigned."
            echo "::notice::macOS users will need to right-click → Open, or run the"
            echo "::notice::shipped 'Open asr-mm.command' launcher once."
            exit 0
          fi
          bash packaging/sign_macos.sh

      - name: Package archives
        # Deliberately plain Python: the default shell on windows-latest is
        # PowerShell, where bash syntax such as `[ ... ] && x=y` is a parse error.
        run: python packaging/make_archives.py --label ${{ matrix.label }}

      # Apple issues a ticket for the exact bytes submitted, so this must run
      # against the archives that actually get uploaded.
      - name: Notarise (macOS)
        if: matrix.target == 'mac'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_PRIVATE_KEY}" ]; then
            echo "::notice::No notarisation key configured — skipping."
            exit 0
          fi
          bash packaging/notarize_macos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asr-mm-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## asr-mm ${{ inputs.tag || github.ref_name }}

            视频指定时间段 → 中文语音转写。全程本地离线，不上传任何音频。

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `asr-mm-<version>-windows-x64.zip`（`asr-mm.exe` 命令行 / `asr-mm-gui.exe` 图形界面） |
            | macOS arm64 | `asr-mm-<version>-macos-arm64.zip`（`.app` 图形界面 / 命令行） |

            ### 首次使用

            1. 解压后运行 `asr-mm.exe`（Windows）或 `asr-mm-gui`（macOS）
            2. 运行 `asr-mm setup` 安装识别引擎并下载模型
               - **Nano**（推荐，911 MB）标点完整、中文准确率最高
               - **Paraformer**（228 MB）最快，无标点
               - **SenseVoice**（244 MB）唯一支持显卡加速
            3. 之后可完全离线使用

            模型不会打进安装包，在首次运行时下载并缓存到用户目录。

            ### 翻译（1.5.0 新增）

            转写后可以把中文结果翻成**英文和日文**，同样完全离线。
            界面在结果表右侧多出「英文」「日文」两列，译文也能手动改；
            导出 Excel 时自动追加两列，txt / srt / json 一并带上。

            翻译模型单独下载（工具 → 下载翻译模型，或 `asr-mm mt download`）：

            | 目标 | 大小 | 授权 | 质量 |
            |---|---|---|---|
            | 中 → 英 | 约 79 MB | CC-BY-4.0，可商用 | 好 |
            | 中 → 日 | 约 473 MB | **CC-BY-NC-4.0，禁止商用** | 需人工复核 |

            > 日文模型为 CC-BY-NC，教学与非营利用途没问题，商用前请先确认。
            > 日文会出实错（如「面積」译成「表面公式」），重要场合请复核。

            选型与踩坑记录见仓库 [docs/TRANSLATION.md](https://github.com/jiangyuyi/asr/blob/main/docs/TRANSLATION.md)。

            ### 许可

            代码 MIT。识别引擎与模型来自 [modelscope/FunASR](https://github.com/modelscope/FunASR)（MIT）。
            翻译运行时 [CTranslate2](https://github.com/OpenNMT/CTranslate2)（MIT）；
            英文翻译模型 [Helsinki-NLP/opus-mt-zh-en](https://huggingface.co/Helsinki-NLP/opus-mt-zh-en)（CC-BY-4.0）；
            日文翻译模型 [facebook/m2m100_418M](https://huggingface.co/facebook/m2m100_418M)（**CC-BY-NC-4.0**）。
          files: release/*
          fail_on_unmatched_files: true
